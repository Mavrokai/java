services:
  mysql:
    image: mysql:8.0
    container_name: my_restaurant_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_restaurant
      MYSQL_USER: my_restaurant
      MYSQL_PASSWORD: my_restaurant
    ports:
      - "3306:3306"
    volumes:
      - my_restaurant_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  my_restaurant_db:
