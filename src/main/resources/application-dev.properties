# Profil de developpement : base H2 fichier (aucune installation requise).
# Les donnees persistent dans ./data entre deux demarrages.
# AUTO_SERVER=TRUE evite l'erreur "file is locked" si une instance tourne deja.
spring.datasource.url=jdbc:h2:file:./data/my_restaurant;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
