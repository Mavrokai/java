spring.application.name=my-restaurant

# Datasource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/my_restaurant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Paris
spring.datasource.username=my_restaurant
spring.datasource.password=my_restaurant
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Active pour permettre le rendu des collections lazy (sections, plats) dans les vues Thymeleaf.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Upload (bannieres GIF, photos de plats)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-http-form-post-size=25MB

# Dossier de stockage des images uploadees
app.upload.dir=uploads

# Locale francaise
spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

# Thymeleaf
spring.thymeleaf.cache=false
